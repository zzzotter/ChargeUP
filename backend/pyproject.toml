[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI 依赖注入的标准写法（Depends/Query 作为默认值）
# UP042: 保留 (str, Enum) 以确保 OpenAPI 中枚举序列化为字符串
ignore = ["B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tools"]
