# 本地开发用数据库（生产级 Docker Compose 编排见第 20 天任务）
# 凭据全部来自 backend/.env（同目录 .env 会被 compose 自动加载），端口只绑定回环地址。
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ledger-guard-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 backend/.env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-ledger}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledger_pgdata:
